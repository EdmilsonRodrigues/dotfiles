# BEGIN_KITTY_THEME
include theme.conf
# END_KITTY_THEME

# Bump scrollback to 50,000 lines (Kitty handles large scrollbacks very well natively)
scrollback_lines 50000

# Pipe your scrollback buffer directly into less (or Neovim) to search logs!
# Pressing Ctrl+Shift+H will open your entire terminal history in a pager.
scrollback_pager less --chopped-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
map ctrl+shift+h show_scrollback

# Automatically copy selected text to the system clipboard
copy_on_select yes

# Strip trailing spaces when copying to avoid accidentally pasting commands with newlines
strip_trailing_spaces smart

# Underline URLs on hover and make them clickable (using your teal accent)
url_style curly
open_url_with default

# NEVER beep at me. (Crucial for Tmux, which loves to ring the bell on limits)
enable_audio_bell no
visual_bell_duration 0.0

# Disable the update check (handled by your package manager anyway)
update_check_interval 0

# Hide window decorations (Sway handles borders, Kitty shouldn't draw its own)
hide_window_decorations yes

# Ensure true color and italic support is advertised to Tmux/Emacs
term xterm-kitty
