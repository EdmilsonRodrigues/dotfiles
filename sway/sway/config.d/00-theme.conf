### Enchanted Forest Color Palette
set $bg_dark       #181f1c
set $bg_surface    #232a2e
set $fg_text       #d3c6aa
set $border_active #a7c080
set $border_muted  #2d3834
set $accent_glow   #7fbbb3
set $accent_urgent #e67e80

# Window Border Colors        BORDER          BG           TEXT        IND              CHILD
client.focused              $border_active  $bg_dark     $fg_text   $accent_glow    $border_active
client.focused_inactive     $border_muted   $bg_dark     $fg_text   $border_muted   $border_muted
client.unfocused            $border_muted   $bg_dark     $fg_text   $border_muted   $border_muted
client.urgent               $accent_urgent  $bg_dark     $fg_text   $accent_urgent  $accent_urgent
client.placeholder          $border_muted   $bg_dark     $fg_text   $border_muted   $border_muted
