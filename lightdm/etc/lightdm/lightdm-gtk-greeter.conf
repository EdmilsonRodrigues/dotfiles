[greeter]
# Everforest dark greeter profile
theme-name=Adwaita-dark
font-name=Maple Mono 11
xft-antialias=true
xft-dpi=96

# Keep your wallpaper and palette aligned with the rest of this dotfiles set
background=/home/familia/.local/share/wallpapers/forest2.jpg
position=50%,center 50%,center

clock-format=%A, %d %B %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~power

# Everforest dark accents
background-color=#1e2326
theme-bg-color=#232a2e
theme-fg-color=#d3c6aa
theme-text-color=#d3c6aa
theme-selected-bg-color=#3a454a
theme-selected-fg-color=#a7c080
theme-tooltip-bg-color=#232a2e
theme-tooltip-fg-color=#d3c6aa
theme-icon-color=#7fbbb3
