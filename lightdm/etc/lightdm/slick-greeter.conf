# Everforest dark profile for slick-greeter (default greeter on this system).
# Wallpaper must live under /usr/share/backgrounds (install-lightdm copies it).

[Greeter]
background=/usr/share/backgrounds/dotfiles-forest2.jpg
background-color=#1e2326
draw-user-backgrounds=false
draw-grid=false
show-hostname=true
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Maple Mono 11
xft-antialias=true
xft-dpi=96
xft-hintstyle=slight
xft-rgba=rgb
enable-hidpi=auto
