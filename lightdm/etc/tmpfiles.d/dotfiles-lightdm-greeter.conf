# slick-greeter runs as lightdm and must persist dconf/cache under its $HOME.
d /var/lib/lightdm 0750 lightdm lightdm -
d /var/lib/lightdm/.config 0750 lightdm lightdm -
d /var/lib/lightdm/.config/dconf 0750 lightdm lightdm -
d /var/lib/lightdm/.cache 0750 lightdm lightdm -
d /var/lib/lightdm/.cache/slick-greeter 0750 lightdm lightdm -
